# ============================================
# SonarQube Scanner configuration
# Used by Jenkinsfile's "SonarQube Analysis" stage
# ============================================
sonar.projectKey=three-tier-devops-project
sonar.projectName=Three-Tier DevOps Project
sonar.projectVersion=1.0.0

# Source directories to analyze
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/coverage/**,**/build/**,**/*.test.js

# Test file patterns
sonar.tests=src
sonar.test.inclusions=**/*.test.js

# Coverage reports (generated by `npm test -- --coverage`)
sonar.javascript.lcov.reportPaths=src/backend/coverage/lcov.info,src/frontend/coverage/lcov.info

# Language
sonar.sourceEncoding=UTF-8
