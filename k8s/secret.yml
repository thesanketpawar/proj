# ============================================
# Secret holds sensitive values (base64 encoded, NOT encrypted)
# Generate values: echo -n 'yourvalue' | base64
# In a real interview/production setup, use AWS Secrets Manager
# or Sealed Secrets / External Secrets Operator instead of raw Secret.
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: three-tier
type: Opaque
data:
  # rootpassword -> base64
  MYSQL_ROOT_PASSWORD: cm9vdHBhc3N3b3Jk
  # employeedb -> base64
  MYSQL_DATABASE: ZW1wbG95ZWVkYg==
  # appuser -> base64
  MYSQL_USER: YXBwdXNlcg==
  # apppassword -> base64
  MYSQL_PASSWORD: YXBwcGFzc3dvcmQ=
